# NSCET CMS Database Configuration
# MySQL Connection
db.url=jdbc:mysql://localhost:3306/nscet_cms?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
db.username=root
db.password=1234
db.driver=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool
db.pool.size=20
db.pool.min=5

# Hibernate
hibernate.dialect=org.hibernate.dialect.MySQLDialect
hibernate.hbm2ddl.auto=update
hibernate.show_sql=false
hibernate.format_sql=true
